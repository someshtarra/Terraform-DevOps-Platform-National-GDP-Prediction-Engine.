name: CD - Deploy to Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to AWS EKS (Dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check AWS Secrets Availability
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret is not set in GitHub repository. Skipping automated AWS deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to AWS ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image to ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gdp-prediction-app-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Kubeconfig for EKS
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          aws eks update-kubeconfig --region us-east-1 --name gdp-eks-dev

      - name: Deploy Helm Chart to Dev Namespace
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          helm upgrade --install gdp-app-dev ./helm/gdp-prediction-app \
            --namespace gdp-dev --create-namespace \
            --values ./helm/gdp-prediction-app/values-dev.yaml \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/gdp-prediction-app-dev \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Run Dev Smoke Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh dev
