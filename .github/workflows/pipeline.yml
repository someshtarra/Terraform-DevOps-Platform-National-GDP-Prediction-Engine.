name: End-to-End DevOps Pipeline (CI/CD & EKS Deployment)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION & SECURITY SCANNING
  # ----------------------------------------------------------------------------
  ci:
    name: 1. CI (Lint, Test, Security & Docker Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pytest-cov flake8 black bandit

      - name: Lint Code (Black & Flake8)
        run: |
          black --check src tests
          flake8 src tests --max-line-length=120 --ignore=E203,W503,F401

      - name: Run Unit Tests (Pytest)
        run: |
          PYTHONPATH=src pytest --cov=src --cov-report=xml --cov-report=term-missing tests/

      - name: Security Scan (Bandit SAST & Gitleaks)
        run: |
          bandit -r src/ -x tests/ -f txt || true

      - name: Setup Helm & Lint Chart
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: |
          helm lint helm/gdp-prediction-app/

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: gdp-prediction-app:${{ github.sha }}

      - name: Scan Docker Image (Trivy Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gdp-prediction-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 2. DEPLOYMENT TO DEV ENVIRONMENT
  # ----------------------------------------------------------------------------
  deploy-dev:
    name: 2. Deploy to DEV & Smoke Test
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not configured. Skipping AWS EKS deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to AWS ECR & Push Image
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gdp-prediction-app-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EKS DEV Cluster via Helm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          aws eks update-kubeconfig --region us-east-1 --name gdp-eks-dev
          helm upgrade --install gdp-app-dev ./helm/gdp-prediction-app \
            --namespace gdp-dev --create-namespace \
            --values ./helm/gdp-prediction-app/values-dev.yaml \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/gdp-prediction-app-dev \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Execute DEV Smoke Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh dev

  # ----------------------------------------------------------------------------
  # 3. DEPLOYMENT TO STAGING ENVIRONMENT
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: 3. Deploy to STAGING & Integration Test
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not configured. Skipping STAGING deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS & ECR Push
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to AWS ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to Staging ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gdp-prediction-app-staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EKS STAGING Cluster via Helm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          aws eks update-kubeconfig --region us-east-1 --name gdp-eks-staging
          helm upgrade --install gdp-app-staging ./helm/gdp-prediction-app \
            --namespace gdp-staging --create-namespace \
            --values ./helm/gdp-prediction-app/values-staging.yaml \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/gdp-prediction-app-staging \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Execute STAGING Integration Tests
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh staging

  # ----------------------------------------------------------------------------
  # 4. DEPLOYMENT TO PRODUCTION ENVIRONMENT (WITH APPROVAL GATE)
  # ----------------------------------------------------------------------------
  deploy-production:
    name: 4. Production Deployment Gate & EKS Rolling Update
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production # Manual Approval Gate in GitHub Environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check AWS Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not configured. Skipping PRODUCTION deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to AWS ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to Production ECR
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gdp-prediction-app-production
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EKS PRODUCTION Cluster via Helm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        id: helm-deploy
        run: |
          aws eks update-kubeconfig --region us-east-1 --name gdp-eks-production
          helm upgrade --install gdp-app-prod ./helm/gdp-prediction-app \
            --namespace gdp-production --create-namespace \
            --values ./helm/gdp-prediction-app/values-production.yaml \
            --set image.repository=${{ steps.login-ecr.outputs.registry }}/gdp-prediction-app-production \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 8m

      - name: Production Smoke Verification
        if: steps.check-secrets.outputs.has_secrets == 'true' && success()
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh production

      - name: Automatic Rollback on Production Failure
        if: steps.check-secrets.outputs.has_secrets == 'true' && failure() && steps.helm-deploy.outcome == 'failure'
        run: |
          echo "Production deployment failed! Rolling back Helm release..."
          helm rollback gdp-app-prod 0 --namespace gdp-production
