apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gdp-prediction-staging
  namespace: argocd
  labels:
    environment: staging
spec:
  project: default
  source:
    repoURL: 'https://github.com/someshtarra/TERRAFORM.git'
    targetRevision: HEAD
    path: helm/gdp-prediction-app
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gdp-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
