apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gdp-prediction-app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "gdp-prediction-app.name" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gdp-prediction-app.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
